[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flixbus-cli"
version = "0.1.0"
description = "flix – Agent-CLI für FlixBus/FlixTrain: Städte, Verbindungen mit Live-Preisen, Fahrtdetails, günstigster Tag, lokaler Preis-Watch. Buchen nicht unterstützt."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smlfg"}]
keywords = [
    "flixbus",
    "flixtrain",
    "flixbus-cli",
    "bus",
    "train",
    "travel",
    "agent",
    "cli",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flix = "flixbus_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"